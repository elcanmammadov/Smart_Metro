<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Smart Metro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <h1 class="main-title">
        Bütün metro xidmətləri <br />
        <span style="text-align: center">bir arada.</span>
      </h1>

      <div class="feature-list">
        <div style="margin-right: 20px" class="feature-item">
          <img src="./img/group-3.svg" alt="Marşrut" />

          <div class="feature-text">
            <div class="feature-title">Marşrut planlaşdır</div>
            <div class="feature-desc">
              Ən optimal marşrutu seç, vaxtına qənaət et.
            </div>
          </div>
        </div>

        <div class="feature-item">
          <img src="./img/group-4.svg" alt="Canlı məlumat" />

          <div style="margin-top: 20px" class="feature-text">
            <div class="feature-title">Canlı məlumat al</div>
            <div class="feature-desc">
              Qatarın gəliş vaxtı və xəbərdarlıqları izlə.
            </div>
          </div>
        </div>

        <div class="feature-item">
          <img src="./img/group-6.svg" alt="Bildiriş" />

          <div class="feature-text">
            <div style="margin-top: 20px" class="feature-title">
              Bildirişlərdən <br />
              xəbərdar xol
            </div>
            <div class="feature-desc">
              Dəyişiklər və yeniliklər haqqında məlumat al.
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-area">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot active"></div>
        </div>
        <button class="btn-start" id="startBtn">Başlayaq</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
