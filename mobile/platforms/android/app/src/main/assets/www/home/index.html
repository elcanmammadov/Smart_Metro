<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart Metro – Ana Səhifə</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app" id="app">

    <!-- ── TOP BAR ── -->
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menyu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Tema dəyiş">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <!-- ── SCROLL AREA ── -->
    <main class="scroll-area">

      <section class="greeting">
        <h1 style="margin-left: 7px;">Salam <span id="greetingName">...</span> <span class="wave" aria-hidden="true">👋</span></h1>
      </section>

      <!-- Route Inputs -->
      <div class="route-inputs">
        <div class="station-field">
          <select class="station-select" id="fromStation" aria-label="Hardan" disabled>
            <option value="" disabled selected>Hardan</option>
          </select>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>

        <button class="swap-btn" id="swapBtn" type="button" aria-label="Stansiyaları dəyiş">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 3 21 8 16 13"/>
            <line x1="21" y1="8" x2="9" y2="8"/>
            <polyline points="8 21 3 16 8 11"/>
            <line x1="3" y1="16" x2="15" y2="16"/>
          </svg>
        </button>

        <div class="station-field">
          <select class="station-select" id="toStation" aria-label="Haraya" disabled>
            <option value="" disabled selected>Haraya</option>
          </select>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>

      <!-- Crowd Slider -->
      <div class="crowd-slider-wrap">
        <div class="crowd-slider" id="crowdSlider" role="region" aria-label="Sıxlıq slayderi"></div>
        <div class="crowd-dots" id="crowdDots" aria-hidden="true"></div>
      </div>

      <!-- Section title -->
      <h2 class="section-title" id="sectionTitle">Ən optimal marşrut</h2>

      <!-- Route card -->
      <div class="route-card" id="routeCard">

        <!-- API-dan marşrut gəlmədikdə göstərilir -->
        <p class="route-msg" id="routeMsg"></p>

        <div id="routeRows">
        <div class="route-row">
          <div class="route-icon time-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <span class="route-label">Vaxt</span>
          <span class="route-value" id="routeTime">12 dəq</span>
        </div>

        <div class="route-divider"></div>

        <div class="route-row">
          <div class="route-icon crowd-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="route-label">Sıxlıq</span>
          <span class="route-value value-red" id="routeCrowd">Sıxlıq</span>
        </div>

        <div class="route-divider"></div>

        <div class="route-row">
          <div class="route-icon transfer-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="9" height="11" rx="2"/>
              <rect x="13" y="7" width="9" height="11" rx="2"/>
              <line x1="11" y1="12" x2="13" y2="12"/>
            </svg>
          </div>
          <div class="route-label-group">
            <span class="route-label">Xətt dəyişmə</span>
            <span class="route-sub" id="routeSub">1 stansiyada xətt dəyişəcəksiniz</span>
          </div>
          <span class="route-value" id="routeTransfer">1 dəfə</span>
        </div>

        </div><!-- /routeRows -->
      </div>

<style>
  .route-divider {
    height: 1.5px;
    background: #cdc9c9;
    margin: 0 16px;
    transition: background var(--t);
  }
  html[data-dark] .route-divider {
    background: #2A2D45;
  }
  .route-msg {
    padding: 14px 16px;
    font-size: 14px;
    color: var(--txt2, #52566e);
    text-align: center;
    line-height: 1.5;
  }
  .route-msg:empty { display: none; }
  #routeRows.hidden { display: none; }
</style>

      <!-- Live button -->
      <button class="btn-live" id="liveBtn" type="button">
        Canlı izləməyə bax
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <div class="scroll-pad"></div>
    </main>

    <!-- ── BOTTOM NAV ── -->
    <nav class="bottom-nav" aria-label="Əsas naviqasiya">

      <button type="button" class="nav-item active" aria-label="Ana səhifə" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
        <span>Ana səhifə</span>
      </button>

      <button type="button" class="nav-item" aria-label="Marşrutlar" data-href="../trip-planner/index.html">
       <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        <span>Marşrutlar</span>
      </button>

      <button type="button" class="nav-item" aria-label="Bildirişlər" data-href="../alert-warning/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>Bildirişlər</span>
      </button>

      <button type="button" class="nav-item" aria-label="Profil" data-href="../profile/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profil</span>
      </button>

    </nav>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../lib/axios.min.js"></script>
  <script src="../lib/api.js"></script>
  <script src="script.js"></script>
</body>
</html>
