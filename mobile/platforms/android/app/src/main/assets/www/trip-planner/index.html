<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Smart Metro – 28 May</title>

    <!-- Tema flaşını önləmək üçün CSS yüklənmədən əvvəl çalışır -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("metro-theme");
        } catch (e) {}
        var dark =
          saved === "dark"
            ? true
            : saved === "light"
              ? false
              : (function () {
                  try {
                    return window.matchMedia("(prefers-color-scheme:dark)")
                      .matches;
                  } catch (e) {
                    return false;
                  }
                })();
        if (dark) document.documentElement.setAttribute("data-dark", "");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── TOP BAR ── -->
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Geri">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <h1 class="topbar-title">28 May stansiyası</h1>

        <button class="icon-btn" id="themeBtn" aria-label="Qaranlıq moda keç">
          <svg
            id="themeIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </header>

      <!-- ── SCROLL AREA ── -->
      <main class="scroll-area" id="scrollArea">
        <div class="scroll-inner">
          <!-- Canlı status + saat -->
          <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Canlı izlənilir</span>
            <span class="status-time" id="clockTime">--:--:--</span>
          </div>

          <!-- Arrival card -->
          <div class="arrival-card">
            <div class="arrival-text">
              <p class="arrival-label">Növbəti qatar</p>
              <p class="arrival-main">
                <span class="arrival-hi" id="arrivalTime">2:00</span> gəlir
              </p>
              <p class="arrival-sub">Azadlıq prospekti istiqaməti</p>
            </div>
            <div class="arrival-icon">
              <svg width="72" height="52" viewBox="0 0 72 52" fill="none">
                <rect
                  x="2"
                  y="10"
                  width="68"
                  height="30"
                  rx="8"
                  fill="rgba(255,255,255,.18)"
                />
                <rect
                  x="4"
                  y="12"
                  width="64"
                  height="26"
                  rx="6"
                  fill="rgba(255,255,255,.12)"
                />
                <rect
                  x="10"
                  y="17"
                  width="14"
                  height="11"
                  rx="3"
                  fill="rgba(255,255,255,.85)"
                />
                <rect
                  x="29"
                  y="17"
                  width="14"
                  height="11"
                  rx="3"
                  fill="rgba(255,255,255,.85)"
                />
                <rect
                  x="48"
                  y="17"
                  width="14"
                  height="11"
                  rx="3"
                  fill="rgba(255,255,255,.85)"
                />
                <line
                  x1="36"
                  y1="28"
                  x2="36"
                  y2="40"
                  stroke="rgba(255,255,255,.3)"
                  stroke-width="1"
                />
                <circle cx="15" cy="43" r="5" fill="rgba(255,255,255,.5)" />
                <circle cx="15" cy="43" r="2.5" fill="rgba(255,255,255,.85)" />
                <circle cx="57" cy="43" r="5" fill="rgba(255,255,255,.5)" />
                <circle cx="57" cy="43" r="2.5" fill="rgba(255,255,255,.85)" />
                <line
                  x1="0"
                  y1="49"
                  x2="72"
                  y2="49"
                  stroke="rgba(255,255,255,.25)"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="0"
                  y1="20"
                  x2="6"
                  y2="20"
                  stroke="rgba(255,255,255,.3)"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <line
                  x1="0"
                  y1="25"
                  x2="4"
                  y2="25"
                  stroke="rgba(255,255,255,.2)"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <line
                  x1="0"
                  y1="30"
                  x2="6"
                  y2="30"
                  stroke="rgba(255,255,255,.3)"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>

          <!-- Wagon occupancy -->
          <section class="section">
            <h2 class="section-title">Vaqonların doluluq səviyyəsi</h2>
            <div class="diagram-card">
              <!-- Pin -->
              <div class="pin-row">
                <div class="wagon-data" data-index="0">
                  <span class="wagon-people">-- nəfər</span>
                  <span class="wagon-empty">-- boş</span>
                  <span class="wagon-percent">--%</span>
                </div>
                <div class="wagon-data" data-index="1">
                  <span class="wagon-people">-- nəfər</span>
                  <span class="wagon-empty">-- boş</span>
                  <span class="wagon-percent">--%</span>
                </div>
                <div class="wagon-data" data-index="2">
                  <span class="wagon-people">-- nəfər</span>
                  <span class="wagon-empty">-- boş</span>
                  <span class="wagon-percent">--%</span>
                </div>
                <div class="wagon-data" data-index="3">
                  <span class="wagon-people">-- nəfər</span>
                  <span class="wagon-empty">-- boş</span>
                  <span class="wagon-percent">--%</span>
                </div>
                <div class="wagon-data" data-index="4">
                  <span class="wagon-people">-- nəfər</span>
                  <span class="wagon-empty">-- boş</span>
                  <span class="wagon-percent">--%</span>
                </div>
              </div>

              <!-- Numbers -->
              <div class="wagon-row">
                <img
                  class="wagon-train-art"
                  src="./img/group-184.svg"
                  alt="Metro qatarının vaqon doluluq sxemi"
                />
                <div
                  class="wagon full"
                  data-index="0"
                  data-status="full"
                  role="button"
                  tabindex="0"
                  aria-label="1-ci vaqon – Dolu"
                >
                  <div class="people-dots">
                    <div class="dot-person"></div>
                    <div class="dot-person dim"></div>
                    <div class="dot-person dimmer"></div>
                  </div>
                </div>
                <div
                  class="wagon moderate"
                  data-index="1"
                  data-status="moderate"
                  role="button"
                  tabindex="0"
                  aria-label="2-ci vaqon – Orta"
                >
                  <div class="people-dots">
                    <div class="dot-person"></div>
                    <div class="dot-person dim"></div>
                  </div>
                </div>
                <div
                  class="wagon moderate"
                  data-index="2"
                  data-status="moderate"
                  role="button"
                  tabindex="0"
                  aria-label="3-cü vaqon – Orta"
                >
                  <div class="people-dots">
                    <div class="dot-person"></div>
                    <div class="dot-person dim"></div>
                  </div>
                </div>
                <div
                  class="wagon empty"
                  data-index="3"
                  data-status="empty"
                  role="button"
                  tabindex="0"
                  aria-label="4-cü vaqon – Boş"
                  id="recWagon"
                >
                  <div class="people-dots">
                    <div class="dot-person"></div>
                  </div>
                </div>
                <div
                  class="wagon empty"
                  data-index="4"
                  data-status="empty"
                  role="button"
                  tabindex="0"
                  aria-label="5-ci vaqon – Boş"
                >
                  <div class="people-dots">
                    <div class="dot-person"></div>
                  </div>
                </div>
              </div>

              <!-- Rail -->
              <div class="rail"><div class="rail-track"></div></div>

              <!-- Legend -->
              <div class="legend">
                <div class="legend-item">
                  <span class="leg-dot leg-full"></span>Dolu
                </div>
                <div class="legend-item">
                  <span class="leg-dot leg-moderate"></span>Orta
                </div>
                <div class="legend-item">
                  <span class="leg-dot leg-empty"></span>Boş
                </div>
              </div>
            </div>
          </section>

          <!-- Best wagon -->
          <button class="best-card" id="bestCard" type="button">
            <div class="best-check">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="best-text">
              <p class="best-label">Ən boş vaqon</p>
              <p class="best-name">4-cü vaqon</p>
              <p class="best-tip">Platformada sarı işarəni izləyin</p>
            </div>
            <div class="best-arrow">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </div>
          </button>

          <!-- Tip image -->
          <img style="width: min(450px, 100%)" src="./img/group-9.svg" alt="" />

          <div class="scroll-pad"></div>
        </div>
      </main>

      <!-- ── BOTTOM NAV ── -->
      <nav class="bottom-nav" aria-label="Əsas naviqasiya">
        <button class="nav-item" aria-label="Ana səhifə" data-href="../home/index.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
            <polyline points="9 21 9 12 15 12 15 21" />
          </svg>
          <span>Ana səhifə</span>
        </button>

        <button
          class="nav-item active"
          aria-label="Marşrutlar"
          aria-current="page"
        >
<svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span>Marşrutlar</span>
        </button>

        <button class="nav-item" aria-label="Bildirişlər" data-href="../alert-warning/index.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span>Bildirişlər</span>
        </button>

        <button class="nav-item" aria-label="Profil" data-href="../profile/index.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Profil</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../lib/axios.min.js"></script>
    <script src="../lib/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
