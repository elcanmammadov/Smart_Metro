<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Metro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="logo-area">
        <div class="logo-icon">
          <img src="./img/image-6.svg" alt="Smart Metro Logo" />
        </div>
        <span class="logo-text">Smart Metro</span>
      </div>

      <div class="title-area">
        <h1>Vaxt itirmə, ağıllı seç!</h1>
        <p>Metro artıq sənin üçün düşünür</p>
      </div>

      <div class="train-area">
        <img src="./img/image-8.svg" alt="Metro qatar" srcset="" />
      </div>

      <div class="bottom-area">
        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div>
        </div>
        <button class="btn-next" id="nextBtn">Növbəti</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
