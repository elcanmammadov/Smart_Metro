<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Qeydiyyat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="header">
        <h1>Qeydiyyatdan keçin!</h1>
        <p>Hesab yaradın və bütün<br />imkanları faydalanmağa başlayın.</p>
      </div>

      <div class="form-area">
        <!-- Full name -->
        <div class="input-wrap" id="wrap-name">
          <span class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" />
            </svg>
          </span>
          <input
            type="text"
            id="fullname"
            placeholder="Tam ad"
            autocomplete="off"
          />
        </div>

        <!-- Phone -->
        <div class="input-wrap" id="wrap-phone">
          <span class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="2" width="14" height="20" rx="3" />
              <circle cx="12" cy="17" r="1" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <input
            type="tel"
            id="phone"
            placeholder="Telefon nömrəsi"
            autocomplete="off"
          />
          <button
            class="input-eye"
            id="phone-clear"
            type="button"
            aria-label="Sil"
            style="display: none"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          </button>
        </div>

        <!-- Password -->
        <div class="input-wrap" id="wrap-pass">
          <span class="input-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input
            type="password"
            id="password"
            placeholder="Şifrə"
            autocomplete="new-password"
          />
          <button
            class="input-eye"
            id="toggle-pass"
            type="button"
            aria-label="Şifrəni göstər/gizlə"
          >
            <svg
              id="eye-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <!-- Terms -->
        <label class="checkbox-row" for="terms">
          <span class="checkbox-box">
            <input type="checkbox" id="terms" />
            <span class="checkbox-custom">
              <svg viewBox="0 0 12 10" fill="none">
                <polyline
                  points="1,5 4.5,9 11,1"
                  stroke="#fff"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </span>
          <span class="checkbox-text">
            Mən <a href="#">istifadə şərtləri</a> və
            <a href="#">məxfilik siyasəti</a> ilə razıyam
          </span>
        </label>

        <!-- Submit -->
        <button class="btn-primary" id="submit-btn" type="button">
          <span class="btn-text">Qeydiyyatdan keç</span>
          <span class="btn-loader"></span>
        </button>

        <!-- Divider -->
        <div class="divider"><span>va ya</span></div>

        <!-- Google -->
        <button class="btn-social" id="google-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Google ilə davam et
        </button>

        <!-- Apple -->
        <button class="btn-social" id="apple-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
            />
          </svg>
          Apple ilə davam et
        </button>
      </div>

      <div class="footer">
        <p>Hesabınız var? <a href="../login/index.html">Daxil olun</a></p>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../lib/axios.min.js"></script>
    <script src="../lib/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
